name: Publish signed LiveOps manifest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "liveops-config.json"
      - "scripts/**"
      - "tools/publish_liveops.py"
      - ".github/workflows/publish-liveops.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Build and sign manifest
        env:
          LIVEOPS_PRIVATE_KEY_PEM: ${{ secrets.LIVEOPS_PRIVATE_KEY_PEM }}
        run: python tools/publish_liveops.py

      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet -- manifest.json; then
            echo "manifest.json is already up to date."
            exit 0
          fi
          git commit -m "Publish signed LiveOps manifest"
          git push
